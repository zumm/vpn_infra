services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    networks:
      wg:
        interface_name: eth0
        gw_priority: 1
        ipv4_address: 10.23.1.254
      traefik:
        interface_name: eth1
        gw_priority: 0
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./data:/etc/wireguard
    ports:
      - 51820:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    env_file: wg-easy.env
    environment:
      - DISABLE_IPV6=true
      - INSECURE=true
      - NUXT_APP_BASE_URL=/wg-easy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg-easy.rule=Host(`$HOSTNAME`) && PathPrefix(`/wg-easy`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.routers.wg-easy.service=wg-easy"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"
      - "traefik.docker.network=traefik"

networks:
  wg:
    name: wg
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.23.1.0/24
  traefik:
    external: true

